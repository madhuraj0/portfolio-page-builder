<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio & Story Page Builder</title>
  <meta name="description" content="A visual, distraction-free block page builder for editorial portfolios, photo essays, and long-form visual stories.">

  <!-- Google Fonts for Curated Typography Themes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&family=Lora:ital,wght@0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@600;700;800&family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <!-- Custom Page Builder Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="mode-edit">

  <!-- Top Application Navigation -->
  <header class="editor-header">
    <div class="editor-nav">
      <div class="d-flex align-items-center gap-3">
        <h1 class="brand-title">
          <i class="fas fa-feather-pointed text-primary"></i>
          <span>StoryBuilder</span>
        </h1>
        <span class="brand-badge">Portfolio</span>
      </div>

      <!-- Center: Viewport Switcher -->
      <div class="btn-group btn-group-sm edit-only" role="group" aria-label="Viewport Switcher">
        <button type="button" class="btn btn-outline-secondary active" data-viewport="desktop" title="Desktop View">
          <i class="fas fa-desktop"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" data-viewport="tablet" title="Tablet View (768px)">
          <i class="fas fa-tablet-screen-button"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" data-viewport="mobile" title="Mobile View (400px)">
          <i class="fas fa-mobile-screen"></i>
        </button>
      </div>

      <!-- Right Actions -->
      <div class="nav-actions">
        <!-- Undo / Redo -->
        <div class="btn-group btn-group-sm edit-only me-2" role="group">
          <button type="button" class="btn btn-outline-secondary" id="btnUndo" title="Undo (Ctrl+Z)" disabled>
            <i class="fas fa-undo"></i>
          </button>
          <button type="button" class="btn btn-outline-secondary" id="btnRedo" title="Redo (Ctrl+Y)" disabled>
            <i class="fas fa-redo"></i>
          </button>
        </div>

        <!-- Typography Theme Switcher -->
        <div class="dropdown edit-only">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="dropdownTypography" data-bs-toggle="dropdown" aria-expanded="false" title="Change Story Typography">
            <i class="fas fa-font me-1"></i> <span id="currentTypographyLabel">Editorial Classic</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="dropdownTypography">
            <li><h6 class="dropdown-header">Story Typography</h6></li>
            <li>
              <button class="dropdown-item active" data-typography="classic">
                <span class="d-block fw-semibold">Editorial Classic</span>
                <small class="text-muted">Playfair Display + Roboto</small>
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-typography="modern">
                <span class="d-block fw-semibold">Modern Studio</span>
                <small class="text-muted">Plus Jakarta Sans + Inter</small>
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-typography="literary">
                <span class="d-block fw-semibold">Literary Book</span>
                <small class="text-muted">Lora + Merriweather</small>
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-typography="creative">
                <span class="d-block fw-semibold">Creative Avant-Garde</span>
                <small class="text-muted">Space Grotesk + DM Sans</small>
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-typography="minimal-mono">
                <span class="d-block fw-semibold">Minimal Mono</span>
                <small class="text-muted">JetBrains Mono + Inter</small>
              </button>
            </li>
          </ul>
        </div>

        <!-- Mode Toggle (Edit / Preview) -->
        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnToggleMode">
          <i class="fas fa-eye me-1"></i> Preview
        </button>

        <!-- Clear Canvas -->
        <button type="button" class="btn btn-sm btn-outline-danger edit-only" id="btnClearAll" title="Clear Story">
          <i class="fas fa-trash-alt"></i>
        </button>

        <!-- Export Dropdown -->
        <div class="dropdown">
          <button class="btn btn-sm btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-file-export me-1"></i> Export & Share
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><h6 class="dropdown-header">Export HTML</h6></li>
            <li>
              <button class="dropdown-item" id="btnCopyFullHTML">
                <i class="fas fa-copy me-2 text-primary"></i> Copy Full Page HTML
              </button>
            </li>
            <li>
              <button class="dropdown-item" id="btnDownloadFullHTML">
                <i class="fas fa-download me-2 text-success"></i> Download as .html File
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><h6 class="dropdown-header">Article Snippet (CMS)</h6></li>
            <li>
              <button class="dropdown-item" id="btnCopySnippetHTML">
                <i class="fas fa-code me-2 text-info"></i> Copy Snippet (Self-Contained Fonts)
              </button>
            </li>
            <li>
              <button class="dropdown-item" id="btnCopySnippetInheritHTML">
                <i class="fas fa-font me-2 text-secondary"></i> Copy Snippet (Inherit Blog Fonts)
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><h6 class="dropdown-header">Project File</h6></li>
            <li>
              <button class="dropdown-item" id="btnExportJSON">
                <i class="fas fa-file-arrow-down me-2 text-info"></i> Save Project (JSON)
              </button>
            </li>
            <li>
              <button class="dropdown-item" id="btnImportJSON">
                <i class="fas fa-file-arrow-up me-2 text-warning"></i> Open Project (JSON)
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <!-- Add Block Palette Bar (Categorized) -->
  <nav class="block-palette-bar" aria-label="Block Palette">
    <!-- Media Group -->
    <div class="palette-group">
      <span class="palette-group-title"><i class="fas fa-camera me-1"></i> Media</span>
      <button class="btn-palette" data-add-block="cover">
        <i class="fas fa-image text-primary"></i> Cover Hero
      </button>
      <button class="btn-palette" data-add-block="wideImage">
        <i class="fas fa-panorama text-warning"></i> Wide Photo
      </button>
      <button class="btn-palette" data-add-block="bleedingImage">
        <i class="fas fa-arrows-alt-h text-danger"></i> Bleed Photo
      </button>
      <button class="btn-palette" data-add-block="twoColumnImage">
        <i class="fas fa-columns text-info"></i> 2-Col Photos
      </button>
      <button class="btn-palette" data-add-block="gallery">
        <i class="fas fa-border-all text-success"></i> Photo Gallery
      </button>
      <button class="btn-palette" data-add-block="embed">
        <i class="fab fa-youtube text-danger"></i> Web Embed
      </button>
      <button class="btn-palette" data-add-block="audioPlayer">
        <i class="fas fa-volume-high text-primary"></i> Audio Player
      </button>
    </div>

    <!-- Text & Layout Group -->
    <div class="palette-group">
      <span class="palette-group-title"><i class="fas fa-pen-nib me-1"></i> Narrative</span>
      <button class="btn-palette" data-add-block="heading">
        <i class="fas fa-heading text-secondary"></i> Heading
      </button>
      <button class="btn-palette" data-add-block="text">
        <i class="fas fa-paragraph text-success"></i> Paragraph
      </button>
      <button class="btn-palette" data-add-block="splitMediaText">
        <i class="fas fa-table-columns text-primary"></i> Split Media+Text
      </button>
      <button class="btn-palette" data-add-block="quote">
        <i class="fas fa-quote-left text-info"></i> Pull Quote
      </button>
      <button class="btn-palette" data-add-block="callout">
        <i class="fas fa-bookmark text-warning"></i> Callout Box
      </button>
      <button class="btn-palette" data-add-block="divider">
        <i class="fas fa-minus text-muted"></i> Divider
      </button>
    </div>

    <!-- Impact & Profile Group -->
    <div class="palette-group">
      <span class="palette-group-title"><i class="fas fa-id-card me-1"></i> Profile & Impact</span>
      <button class="btn-palette" data-add-block="stats">
        <i class="fas fa-chart-simple text-primary"></i> Big Stats
      </button>
      <button class="btn-palette" data-add-block="timeline">
        <i class="fas fa-timeline text-secondary"></i> Timeline
      </button>
      <button class="btn-palette" data-add-block="skillsPills">
        <i class="fas fa-tags text-success"></i> Skills Pills
      </button>
      <button class="btn-palette" data-add-block="authorBio">
        <i class="fas fa-user text-info"></i> Author Bio
      </button>
      <button class="btn-palette" data-add-block="ctaBanner">
        <i class="fas fa-bullhorn text-danger"></i> CTA Banner
      </button>
      <button class="btn-palette" data-add-block="caption">
        <i class="fas fa-closed-captioning text-muted"></i> Caption
      </button>
      <button class="btn-palette" data-add-block="footer">
        <i class="fas fa-shoe-prints text-dark"></i> Footer
      </button>
    </div>
  </nav>

  <!-- Workspace Canvas -->
  <main class="workspace-wrapper">
    <div id="storyCanvas" class="story-canvas viewport-desktop">
      <!-- Blocks rendered dynamically by app.js -->
    </div>
  </main>

  <!-- Hidden File Input for JSON Project Import -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;">

  <!-- Modal for Adding / Editing Blocks -->
  <div class="modal fade" id="blockEditModal" tabindex="-1" aria-labelledby="blockModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="blockModalTitle">Edit Block</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="blockModalBody">
          <!-- Dynamic Form Fields -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnSaveBlock">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Bootstrap 5.3.3 Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
